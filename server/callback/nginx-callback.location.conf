    # "Заказать звонок": the form posts here; the kupit-tyr-lead service listens on loopback only.
    # Goes into the HTTPS server block of /etc/nginx/sites-available/kupit-tyr, before "location / {".
    location = /api/callback {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8731;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 45s;
    }

